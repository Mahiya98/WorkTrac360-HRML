/* ------------------------------- reports -------------------------------- */
function dstr(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function taskDateKey(t){
  if(dateBasis==='due') return t.dueDate||'';
  if(dateBasis==='updated') return t.updatedAt? dstr(t.updatedAt) : '';
  return t.createdAt? dstr(t.createdAt) : '';
}
function dateWiseTasks(){
  let ts=visibleTasks(current);
  if(isSuper() && window.__repSec && window.__repSec!=='All') ts=ts.filter(t=>t.section===window.__repSec);
  if(dateFrom) ts=ts.filter(t=>taskDateKey(t)>=dateFrom);
  if(dateTo) ts=ts.filter(t=>taskDateKey(t)<=dateTo);
  return ts;
}
function reportsView(){
  /* all reports below use the same date basis + range as the Date-wise record */
  const ts=dateWiseTasks();
  const group=(fn)=>{ const m={}; ts.forEach(t=>{ const k=fn(t); (m[k]=m[k]||{n:0,est:0,act:0,done:0,over:0}); m[k].n++;
    m[k].est+=+t.estMin||0; m[k].act+=+t.actualMin||0; if(t.status==='Done'||t.status==='Verified') m[k].done++; if(isOverdue(t)) m[k].over++; }); return m; };
  const table=(m)=>Object.keys(m).sort((a,b)=>m[b].n-m[a].n).map(k=>{ const r=m[k];
    return `<tr><td>${esc(k)}</td><td>${r.n}</td><td>${r.done}</td><td>${Math.round(r.done*100/r.n)}%</td><td>${r.over}</td><td>${r.est}</td><td>${r.act}</td><td>${r.est?Math.round(r.act*100/r.est):0}%</td></tr>`;
  }).join('')||'<tr><td colspan=8 class="empty">—</td></tr>';
  const head=`<tr><th>Group</th><th>Tasks</th><th>Done</th><th>Completion</th><th>Overdue</th><th>Est. min</th><th>Actual min</th><th>Time used</th></tr>`;

  /* ---- date-wise record ---- */
  const dw=dateWiseTasks();
  const dates=[...new Set(dw.map(taskDateKey).filter(Boolean))].sort().reverse();
  const tot={n:0,est:0,act:0,c:{}}; STATUSES.forEach(s=>tot.c[s]=0);
  const dwRows=dates.map(d=>{
    const rows=dw.filter(t=>taskDateKey(t)===d);
    const c={}; STATUSES.forEach(s=>c[s]=0); rows.forEach(t=>c[t.status]++);
    const est=rows.reduce((a,t)=>a+(+t.estMin||0),0), act=rows.reduce((a,t)=>a+(+t.actualMin||0),0);
    tot.n+=rows.length; tot.est+=est; tot.act+=act; STATUSES.forEach(s=>tot.c[s]+=c[s]);
    return `<tr><td><b>${esc(d)}</b></td><td>${rows.length}</td>${STATUSES.map(s=>`<td>${c[s]||''}</td>`).join('')}<td>${est}</td><td>${act}</td></tr>`;
  }).join('');
  const dwDetail=dw.slice().sort((a,b)=>taskDateKey(b).localeCompare(taskDateKey(a))).map(t=>`
    <tr><td class="small">${esc(taskDateKey(t))}</td>
      <td><b>${esc(t.code)}</b><div class="small muted">${esc(t.title)}</div></td>
      <td class="small">${esc(t.role)}</td><td class="small">${esc(user(t.assigneeId).name)}</td>
      <td>${statusBadge(t.status)}</td><td>${prioBadge(t.priority)}</td>
      <td class="small">${t.estMin} / ${t.actualMin}</td></tr>`).join('');

  return `
  <div class="card"><h2>Reports — ${isSuper()?'All Departments':esc(current.section)}</h2>
    <p class="desc">Every report below follows the <b>date range</b> (by due date) selected in the Date-wise record. Adjust it there to filter all sections and exports.</p>
    <div class="row">
      ${isSuper()?`<div class="field" style="min-width:200px"><label>Department</label>
        <select onchange="window.__repSec=this.value;render()">
          <option value="All" ${(window.__repSec||'All')==='All'?'selected':''}>All departments</option>
          ${SECTIONS.map(s=>`<option ${window.__repSec===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select></div>`:''}
      <button class="btn" onclick="exportCSV()">⬇ Export all tasks (CSV)</button>
      <button class="btn" onclick="exportDateWise()">⬇ Export date-wise record (CSV)</button>
      <button class="btn ghost" onclick="exportDict()">⬇ Export dictionary (CSV)</button>
    </div>
  </div>

  <div class="card"><h2>Date-wise Task &amp; Status Record</h2>
    <p class="desc">Tasks grouped by date with status counts — for trend and performance analysis.</p>
    <div class="row">
      <div class="field" style="min-width:160px"><label>From</label><input type="date" value="${dateFrom}" onchange="dateFrom=this.value;render()"></div>
      <div class="field" style="min-width:160px"><label>To</label><input type="date" value="${dateTo}" onchange="dateTo=this.value;render()"></div>
      <button class="btn ghost" onclick="dateFrom='';dateTo='';render()">Clear filter</button>
    </div>
    <table>
      <tr><th>Date</th><th>Total</th>${STATUSES.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Est. min</th><th>Actual min</th></tr>
      ${dwRows||'<tr><td colspan="11" class="empty">No records in this range.</td></tr>'}
      ${dates.length?`<tr style="font-weight:700;background:#eef3f8"><td>Total</td><td>${tot.n}</td>${STATUSES.map(s=>`<td>${tot.c[s]||''}</td>`).join('')}<td>${tot.est}</td><td>${tot.act}</td></tr>`:''}
    </table>
  </div>

  <div class="card"><h2>Task Detail — filtered</h2>
    <table><tr><th>Date</th><th>Task</th><th>Role</th><th>Assignee</th><th>Status</th><th>Priority</th><th>Est / Actual</th></tr>
    ${dwDetail||'<tr><td colspan=7 class="empty">No records.</td></tr>'}</table>
  </div>

  <div class="card"><h2>By Status</h2><p class="desc">Within the selected date range.</p><table>${head}${table(group(t=>t.status))}</table></div>
  <div class="card"><h2>By Role</h2><p class="desc">Within the selected date range.</p><table>${head}${table(group(t=>t.role))}</table></div>
  <div class="card"><h2>By Team Member</h2><p class="desc">Within the selected date range.</p><table>${head}${table(group(t=>user(t.assigneeId).name))}</table></div>`;
}
function exportDateWise(){
  const ts=dateWiseTasks().slice().sort((a,b)=>taskDateKey(b).localeCompare(taskDateKey(a)));
  const head=['Date','Code','Title','Department','Role','Assignee','Enroll','Status','Priority','Shift','Frequency','EstMin','ActualMin'];
  const rows=ts.map(t=>[taskDateKey(t),t.code,t.title,t.section,t.role,user(t.assigneeId).name,user(t.assigneeId).enroll,t.status,t.priority,t.shift,t.frequency,t.estMin,t.actualMin]);
  download('HRML_datewise_tasks.csv',[head,...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'));
}
function download(name,text){ const b=new Blob([text],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportCSV(){
  const ts=dateWiseTasks();
  const head=['Code','Title','Department','Role','Assignee','Enroll','Status','Priority','Shift','Frequency','EstMin','ActualMin','DueDate','Overdue','Created','Updated'];
  const rows=ts.map(t=>[t.code,t.title,t.section,t.role,user(t.assigneeId).name,user(t.assigneeId).enroll,t.status,t.priority,t.shift,t.frequency,t.estMin,t.actualMin,t.dueDate,isOverdue(t)?'Yes':'No',fmt(t.createdAt),fmt(t.updatedAt)]);
  download('HRML_tasks.csv',[head,...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'));
}
function exportDict(){
  const head=['Department','Role','Task','EstMin','Priority','Frequency'];
  const rows=DB.dict.map(d=>[d.section,d.role,d.title,d.estMin,d.priority,d.frequency]);
  download('HRML_dictionary.csv',[head,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n'));
}

/* Duplicate accounts share an Enroll ID (often created by re-registration).
   Showing tasks by enroll keeps them visible, but the data is still messy. */
function cleanSectionVal(s){
  s=String(s==null?'':s).trim();
  if(SECTIONS.indexOf(s)>=0) return s;
  const base=s.split('.')[0].trim();
  return SECTIONS.indexOf(base)>=0?base:s;
}
function dupGroups(){
  const norm=s=>String(s==null?'':s).trim().toLowerCase();
  const map={};
  DB.users.forEach(u=>{ const k=norm(u.enroll); if(!k) return; (map[k]=map[k]||[]).push(u); });
  return Object.keys(map).map(k=>({enroll:k, users:map[k]})).filter(g=>g.users.length>1);
}
function openDedupe(){
  const groups=dupGroups();
  const badSec=DB.users.filter(u=>cleanSectionVal(u.section)!==String(u.section||'').trim());
  if(!groups.length && !badSec.length){ toast('No duplicates or invalid departments found.'); return; }
  const rows=groups.map(g=>{
    const names=[...new Set(g.users.map(u=>esc(u.name)))].join(' / ');
    const types=g.users.map(u=>esc(u.type)).join(', ');
    const secs=[...new Set(g.users.map(u=>esc(u.section)))].join(' | ');
    return `<tr><td>${names}</td><td>${esc(g.users[0].enroll)}</td><td class="small">${types}</td><td class="small">${secs}</td><td>${g.users.length}</td></tr>`;
  }).join('');
  modal(`<h3>Clean duplicate accounts</h3>
    <p class="desc">Accounts sharing the same Enroll ID. Merging keeps the best account, moves its tasks &amp; notifications to it, and removes the rest. Groups with different names under one Enroll ID are skipped for manual review.</p>
    ${groups.length?`<table><tr><th>Name(s)</th><th>Enroll</th><th>Types</th><th>Departments</th><th>#</th></tr>${rows}</table>`:'<p class="small muted">No duplicate Enroll IDs.</p>'}
    ${badSec.length?`<p class="small">${badSec.length} account(s) have an invalid department (extra text after the department name) and will be corrected.</p>`:''}
    <div style="margin-top:12px"><button class="btn" style="background:#C0392B" onclick="runDedupe()">Merge ${groups.length} group(s) &amp; fix ${badSec.length} department(s)</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function runDedupe(){
  const groups=dupGroups();
  let merged=0, removed=0, fixed=0, skipped=0;
  groups.forEach(g=>{
    const uniqNames=[...new Set(g.users.map(u=>String(u.name||'').trim().toLowerCase()))];
    if(uniqNames.length!==1){ skipped++; return; }
    const score=u=>{ let s=0; if(SECTIONS.indexOf(cleanSectionVal(u.section))>=0) s+=100;
      s+=DB.tasks.filter(t=>t.assigneeId===u.id).length;
      if(u.status==='approved') s+=10; if(u.type==='supervisor') s+=5; return s; };
    const sorted=g.users.slice().sort((a,b)=>score(b)-score(a));
    const keep=sorted[0];
    if(String(keep.section||'').trim()!==cleanSectionVal(keep.section)) keep.section=cleanSectionVal(keep.section);
    sorted.slice(1).forEach(bad=>{
      DB.tasks.forEach(t=>{ if(t.assigneeId===bad.id) t.assigneeId=keep.id; if(t.supervisorId===bad.id) t.supervisorId=keep.id; });
      DB.notify.forEach(n=>{ if(n.to===bad.id) n.to=keep.id; });
      tombstone(bad.id);
      DB.users=DB.users.filter(u=>u.id!==bad.id);
      removed++;
    });
    merged++;
  });
  DB.users.forEach(u=>{ const c=cleanSectionVal(u.section); if(c!==String(u.section||'').trim()){ u.section=c; fixed++; } });
  save(); render();
  toast(`Merged ${merged} group(s), removed ${removed} duplicate(s), fixed ${fixed} department(s)${skipped?', skipped '+skipped+' ambiguous':''}.`);
}

/* ------------------------------- workload ------------------------------- */
function loadColor(p){ return p>100?'#C0392B':p>=80?'#E67E22':'#1E8449'; }
function workloadScope(u, sec){ return isSuper() ? (sec==='All' || u.section===sec) : (u.section===current.section); }
function firstOfMonth(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-01'; }
function daysBetween(a,b){ const A=new Date(a+'T00:00:00'), B=new Date(b+'T00:00:00'); return Math.max(1, Math.round((B-A)/86400000)+1); }
function workloadView(){
  const avail=+DB.settings.dailyMinutes||480;
  const from=window.__loadFrom||dateStr(0);
  const to=window.__loadTo||dateStr(0);
  const days=daysBetween(from,to);
  const cap=avail*days;                       /* available minutes per person over the range */
  const sec=isSuper() ? (window.__loadSec||'All') : current.section;
  const scope=u=>workloadScope(u, sec);
  const inScopeSec=s=>isSuper()?(sec==='All'||s===sec):(s===current.section);

  const dayTasks=DB.tasks.filter(t=>t.dueDate && t.dueDate>=from && t.dueDate<=to && inScopeSec(t.section));

  /* ---- by role ---- */
  const roleKeys=[];
  DB.roles.forEach(r=>{ if(isSuper()?(sec==='All'||r.section===sec):r.section===current.section) roleKeys.push(r.section+'\u0001'+r.name); });
  const roleRows=roleKeys.map(k=>{
    const [s,role]=k.split('\u0001');
    const mems=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&u.section===s&&u.role===role);
    const ts=dayTasks.filter(t=>t.section===s&&t.role===role);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    const av=mems.length*cap;
    return {s,role,mems:mems.length,ts:ts.length,mins,av,pct:av?Math.round(mins*100/av):0};
  }).sort((a,b)=>b.pct-a.pct);

  /* ---- by person ---- */
  const memberRows=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&scope(u)).map(u=>{
    const ts=dayTasks.filter(t=>t.assigneeId===u.id);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    return {u,ts:ts.length,mins,pct:Math.round(mins*100/cap)};
  }).sort((a,b)=>b.pct-a.pct);

  const totMins=dayTasks.reduce((a,t)=>a+(+t.estMin||0),0);
  const totAv=memberRows.length*cap;
  const totPct=totAv?Math.round(totMins*100/totAv):0;

  const bar=p=>`<div class="bar" style="min-width:80px"><i style="width:${Math.min(p,100)}%;background:${loadColor(p)}"></i></div><span class="small"><b>${p}%</b></span>`;

  /* ---- by department (super admin) ---- */
  const deptRows=SECTIONS.map(s=>{
    const mems=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&u.section===s);
    const ts=dayTasks.filter(t=>t.section===s);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    const av=mems.length*cap;
    return {s,mems:mems.length,ts:ts.length,mins,av,pct:av?Math.round(mins*100/av):0};
  }).filter(d=>d.mems||d.ts).sort((a,b)=>b.pct-a.pct);

  const deptTable=deptRows.map(d=>`<tr>
      <td><b>${esc(d.s)}</b></td><td>${d.mems}</td><td>${d.ts}</td><td>${d.mins}</td><td>${d.av}</td>
      <td>${bar(d.pct)}</td>
      <td><button class="btn sm ghost" onclick="window.__loadSec='${d.s}';go('workload')">Open</button></td></tr>`).join('')
      ||'<tr><td colspan=7 class="empty">No department load for this date.</td></tr>';

  const deptCard = isSuper() ? `
  <div class="card"><h2>Load by Department</h2>
    <p class="desc">Department-wise capacity vs assigned minutes. Available = members × ${avail} × ${days} days.</p>
    <table><tr><th>Department</th><th>Members</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th><th></th></tr>
    ${deptTable}</table>
  </div>` : '';

  const roleTable=roleRows.map(r=>`<tr>
      <td><b>${esc(r.role)}</b><div class="small muted">${esc(r.s)}</div></td>
      <td>${r.mems}</td><td>${r.ts}</td><td>${r.mins}</td><td>${r.av}</td>
      <td>${bar(r.pct)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">No roles in scope.</td></tr>';

  const memberTable=memberRows.map(m=>`<tr>
      <td><b>${esc(m.u.name)}</b><div class="small muted">${esc(m.u.enroll)} · ${esc(m.u.section)}</div></td>
      <td>${esc(m.u.role)}</td><td>${m.ts}</td><td>${m.mins}</td><td>${cap}</td>
      <td>${bar(m.pct)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">No team members in scope.</td></tr>';

  return `
  <div class="card"><h2>Workload — ${esc(sec==='All'?'All Departments':sec)}</h2>
    <p class="desc">Capacity vs assigned task minutes over a date range. Load % = assigned minutes ÷ available minutes.</p>
    <div class="row">
      <div class="field" style="min-width:160px"><label>From</label>
        <input type="date" value="${from}" onchange="window.__loadFrom=this.value;render()"></div>
      <div class="field" style="min-width:160px"><label>To</label>
        <input type="date" value="${to}" onchange="window.__loadTo=this.value;render()"></div>
      <button class="btn ghost" onclick="window.__loadFrom=dateStr(0);window.__loadTo=dateStr(0);render()">Today</button>
      <button class="btn ghost" onclick="window.__loadFrom=firstOfMonth();window.__loadTo=dateStr(0);render()">This month</button>
      ${isSuper()?`<div class="field" style="min-width:200px"><label>Department</label>
        <select onchange="window.__loadSec=this.value;render()">
          <option value="All" ${sec==='All'?'selected':''}>All departments</option>
          ${SECTIONS.map(s=>`<option ${sec===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select></div>`:''}
      <div class="field" style="min-width:180px"><label>Available minutes / person / day</label>
        <input type="number" min="1" value="${avail}" onchange="DB.settings.dailyMinutes=+this.value||480;save();render()"></div>
    </div>
    <div class="grid g4">
      <div class="kpi"><div class="v">${dayTasks.length}</div><div class="l">Tasks in range</div></div>
      <div class="kpi"><div class="v">${totMins}</div><div class="l">Assigned minutes</div></div>
      <div class="kpi"><div class="v">${totAv}</div><div class="l">Available minutes</div></div>
      <div class="kpi"><div class="v" style="color:${loadColor(totPct)}">${totPct}%</div><div class="l">Overall load</div></div>
    </div>
    <p class="hint"><b>${days}</b> day(s) · ${esc(from)} → ${esc(to)} · per person capacity = ${avail} × ${days} = <b>${cap} min</b>.
      &nbsp; Load colour: <b style="color:#1E8449">under 80%</b> · <b style="color:#E67E22">80–100%</b> · <b style="color:#C0392B">over 100%</b></p>
  </div>

  <div class="card"><h2>Load by Role</h2>
    <p class="desc">Available minutes = members × ${avail} × ${days} days.</p>
    <table><tr><th>Role</th><th>Members</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th></tr>
    ${roleTable}</table>
  </div>

  ${deptCard}

  <div class="card"><h2>Load by Team Member</h2>
    <p class="desc">Available minutes = ${avail} × ${days} days = ${cap} min per person.</p>
    <table><tr><th>Member</th><th>Role</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th></tr>
    ${memberTable}</table>
  </div>`;
}

function notifyView(){
  const list=myNotifs();
  const rows=list.map(n=>`<div class="nrow ${n.read?'':'unread'}">
      <div class="t">${esc(n.title)}</div><div class="b">${esc(n.body)}</div><div class="m">${fmt(n.at)}</div></div>`).join('');
  return `<div class="card"><h2>Notifications</h2>
    <p class="desc">Task assignments, approvals and updates relevant to you.</p>
    ${rows||'<div class="empty">No notifications.</div>'}</div>`;
}

/* ------------------------------ task detail ----------------------------- */
function taskPanel(t){
  const a=user(t.assigneeId), s=user(t.supervisorId);
  const isAssignee=current.id===t.assigneeId;
  const isSup = isSuper() || (current.type==='supervisor' && current.section===t.section);
  const comments=t.comments.map(c=>`<div style="border-left:3px solid #cfe0ee;padding:6px 10px;margin-bottom:6px">
    <b>${esc(user(c.by).name)}</b> <span class="small muted">${fmt(c.at)}</span><div class="small">${esc(c.text)}</div></div>`).join('')||'<div class="small muted">No comments.</div>';
  const atts=t.attachments.map(f=>`<span class="pill">📎 ${esc(f.name)} <span class="muted">${esc(f.size)}</span></span>`).join('')||'<span class="small muted">No attachments.</span>';
  const statusOpts=MEMBER_STATUSES.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('');
  const memberPanel=isAssignee?`<h3>Update status</h3>
    <div class="row">
      <div class="field" style="min-width:170px"><label>Status</label><select id="stSel">${statusOpts}</select></div>
      <div class="field" style="min-width:130px"><label>Actual minutes</label><input id="stMin" type="number" value="${t.actualMin||0}"></div>
      <button class="btn green" onclick="updateStatus('${t.id}')">Submit update</button>
      <button class="btn ghost" onclick="toggleTimer('${t.id}')">${t.timerStart?'⏹ Stop timer':'▶ Start timer'}</button>
    </div>`:'';
  const supPanel=isSup?`<h3>Supervisor actions</h3>
    <div class="row">
      <button class="btn green" onclick="verifyTask('${t.id}',1)">✔ Verify as done</button>
      <button class="btn red" onclick="verifyTask('${t.id}',0)">↺ Reopen / reject</button>
    </div>`:'';
  return `<div class="grid g2 small">
      <div><b>Assignee:</b> ${esc(a.name)} (${esc(a.enroll)})</div><div><b>Supervisor:</b> ${esc(s.name)}</div>
      <div><b>Estimated:</b> ${t.estMin} min</div><div><b>Actual:</b> ${t.actualMin} min ${t.timerStart?'· timer running':''}</div>
      <div><b>Shift:</b> ${esc(t.shift)}</div><div><b>Frequency:</b> ${esc(t.frequency)}</div>
      <div><b>Due:</b> ${t.dueDate||'—'}</div><div><b>Created:</b> ${fmt(t.createdAt)}</div>
    </div>
    <h3>Attachments (evidence)</h3><div>${atts}</div>
    ${(isAssignee||isSup)?`<div style="margin-top:8px"><input type="file" onchange="attachFile('${t.id}',this)"></div>`:''}
    <h3>Comments</h3><div>${comments}</div>
    <div class="row" style="margin-top:8px"><div class="field" style="flex:1;min-width:220px;margin-bottom:0"><input id="cmtText" placeholder="Write a comment…" onkeydown="if(event.key==='Enter'){event.preventDefault();addComment('${t.id}')}"></div>
      <button class="btn ghost" onclick="addComment('${t.id}')">Comment</button></div>
    ${memberPanel}${supPanel}
    ${isSup?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <button class="btn red" onclick="deleteTask('${t.id}')">🗑 Delete this task</button></div>`:''}`;
}
function afterTaskAction(id){
  if(document.getElementById('modalBg')) openTask(id); else render();
}
function openTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  modal(`
    <h2>${esc(t.code)} · ${esc(t.title)}</h2>
    <div style="margin-bottom:10px">${statusBadge(t.status)} ${prioBadge(t.priority)} ${badge(t.section,'b-blue')} ${badge(t.role,'b-grey')} ${isOverdue(t)?badge('Overdue','b-red'):''}</div>
    ${taskPanel(t)}
    <div style="margin-top:16px"><button class="btn grey" onclick="closeModal()">Close</button></div>`);
}
function updateStatus(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status=document.getElementById('stSel').value; t.actualMin=+document.getElementById('stMin').value||0; t.updatedAt=Date.now();
  if(t.supervisorId) notify(t.supervisorId, `Task ${t.code} updated`, `${current.name} set ${t.code} (${t.title}) to "${t.status}". Actual: ${t.actualMin} min.`);
  save(); toast('Status updated.'); closeModal(); render();
}
function toggleTimer(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  if(t.timerStart){ const mins=Math.max(1,Math.round((Date.now()-t.timerStart)/60000)); t.actualMin=(+t.actualMin||0)+mins; t.timerStart=null; toast(`Timer stopped · +${mins} min.`); }
  else { t.timerStart=Date.now(); toast('Timer started.'); }
  t.updatedAt=Date.now(); save(); afterTaskAction(id);
}
function attachFile(id,input){ const t=DB.tasks.find(x=>x.id===id); const f=input.files[0]; if(!f) return;
  t.attachments.push({name:f.name,size:Math.round(f.size/1024)+' KB'}); save(); afterTaskAction(id); }
function addComment(id){ const t=DB.tasks.find(x=>x.id===id); const txt=document.getElementById('cmtText').value.trim(); if(!txt) return;
  t.comments.push({by:current.id,at:Date.now(),text:txt}); t.updatedAt=Date.now(); save(); afterTaskAction(id); }
function verifyTask(id, ok){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status=ok?'Verified':'Reopened'; t.updatedAt=Date.now();
  notify(t.assigneeId, `Task ${t.code} ${ok?'verified':'reopened'}`, `${current.name} ${ok?'verified':'reopened'} ${t.code} (${t.title}).`);
  save(); toast(ok?'Task verified.':'Task reopened.'); afterTaskAction(id);
}
function modal(html){ closeModal();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`; wrapTables(bg); bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); }
function closeModal(){ document.querySelectorAll('#modalBg,.modal-bg').forEach(m=>m.remove()); }

updateNetGate();
load();
restoreSession();
render();
if(apiUrl()) apiLoad().then(ok=>{ if(ok) render(); });
scheduleSyncLoop();
</script>
</body>
</html>
